# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI and SonarQube Analysis

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Create config.ini file
      shell: bash
      run: |
        cat << EOF > config.ini
        [paths]
        movies_folder = Films
        tv_shows_folder = Séries
        not_sorted_media_files_folder = .download

        [api]
        gemini_api_key = ${{ secrets.GEMINI_API_KEY }}
        tmdb_api_key = ${{ secrets.TMDB_API_KEY }}
        groq_api_key = ${{ secrets.GROQ_API_KEY }}
        openrouter_api_key = ${{ secrets.OPENROUTER_API_KEY }}
        cloudflare_api_token = ${{ secrets.CLOUDFLARE_API_TOKEN }}
        cloudflare_account_id = ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        [email]
        mail = ${{ secrets.MAIL }}
        mail_pswd = ${{ secrets.MAIL_PSWD }}

        [options]
        resolution = true
        quality = true
        EOF

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests and Generate Coverage
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          if ! command -v xvfb-run &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          xvfb-run -a pytest --cov=src --cov-report=xml
        else
          pytest --cov=src --cov-report=xml
        fi

    # upload coverage file when os is ubuntu
    - name: Upload coverage artifact
      if: matrix.os == 'ubuntu-latest' 
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        include-hidden-files: true
        retention-days: 1

    - name: Build Standalone Executable (PyInstaller)
      run: |
        pyinstaller media-organizer.spec --noconfirm

    - name: Test Standalone Executable on ${{ matrix.os }}
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          ./dist/media-organizer.exe --help
          ./dist/media-organizer.exe config --list
        else
          chmod +x ./dist/media-organizer
          ./dist/media-organizer --help
          ./dist/media-organizer config --list
        fi

  sonarqube:
    name: SonarQube Scan
    needs: test 
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download coverage artifact
      uses: actions/download-artifact@v4
      with:
        name: coverage-report

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v4
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}